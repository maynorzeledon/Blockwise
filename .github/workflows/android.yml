name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'web/**', 'scripts/android-assets.mjs', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      api_origin:
        description: 'Public Cloudflare origin, e.g. https://blockwise.example.workers.dev (optional)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node tests/backend.mjs
      - run: node tests/theme.mjs
      - run: node tests/frontend.mjs
      - run: node scripts/bundle.mjs
      - run: node scripts/validate-artifact.mjs worker/index.js
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: node scripts/android-assets.mjs
        env:
          BLOCKWISE_API_ORIGIN: ${{ inputs.api_origin || vars.BLOCKWISE_API_ORIGIN }}
      - run: gradle -p android assembleDebug assembleDebugAndroidTest assembleRelease --no-daemon
      - name: Sign release APK with the permanent key, when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOCKWISE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BLOCKWISE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BLOCKWISE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLOCKWISE_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Release signing secrets are not configured; unsigned release artifact only.'
            exit 0
          fi
          umask 077
          keyfile="$RUNNER_TEMP/blockwise-release.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$keyfile" --ks-key-alias "${KEY_ALIAS:-blockwise}" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out android/app/build/outputs/apk/release/Blockwise-Android.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/Blockwise-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Blockwise-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/Blockwise-Android.apk

  system-bars:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Blockwise-Android-APK
          path: apk
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test-android-insets.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-${{ matrix.api }}-system-bars
          path: android-test-results
