name: Build Windows installer
on:
  push:
    branches: [main]
    paths: ['web/**', 'desktop/**', 'scripts/desktop-assets.mjs', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node scripts/desktop-assets.mjs
        env:
          BLOCKWISE_API_ORIGIN: ${{ vars.BLOCKWISE_API_ORIGIN }}
      - run: npm ci --prefix desktop
      - run: npm run build --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch packaged app and verify the fact feed
        shell: pwsh
        run: |
          $process = Start-Process -FilePath desktop/dist/win-unpacked/Blockwise.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged app smoke check failed" }
          Get-Content "$env:TEMP/blockwise-windows-smoke.json"
      - uses: actions/upload-artifact@v4
        with:
          name: Blockwise-Windows
          path: desktop/dist/Blockwise-Windows-Setup.exe
